# Luminous Stockhaven twin (Fly.io app "scanstock-luminous", region dfw).
# T1: the twin is always on — customers need it up, so unlike the old
# Scan demo it must NOT auto-stop to zero.
app = "scanstock-luminous"
primary_region = "dfw"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
